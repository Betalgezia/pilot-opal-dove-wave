name: CI

on:
  push:
    branches: [main, quality-engine-v2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate dependency specs
        run: npm install --package-lock-only --dry-run --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Mihomo config tests
        run: npm run test:mihomo
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
